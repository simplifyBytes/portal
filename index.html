async function unlock(pw){
  const raw=Uint8Array.from(atob(DATA),c=>c.charCodeAt(0));  // openssl layout: "Salted__" + 8-byte salt + ciphertext
  const km=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveBits"]);
  const bits=new Uint8Array(await crypto.subtle.deriveBits({name:"PBKDF2",salt:raw.slice(8,16),iterations:600000,hash:"SHA-256"},km,384));
  const key=await crypto.subtle.importKey("raw",bits.slice(0,32),"AES-CBC",false,["decrypt"]);
  return new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-CBC",iv:bits.slice(32,48)},key,raw.slice(16)));
}

  try{const h=await unlock(document.getElementById("p").value);if(!h.startsWith("<!doctype"))throw 0;document.open();document.write(h);document.close();}
  catch(_){document.getElementById("m").textContent="Wrong password";}
});
